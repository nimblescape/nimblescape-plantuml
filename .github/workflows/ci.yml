# Check and test the extension and build its packages for every push to main
# and every pull request. The job "Test and package" installs the locked
# development tools, checks the types, runs the linter and the tests,
# packages the VSIX with vsce, which first bundles the extension with esbuild
# and also validates the manifest and the README, runs the tests in VS Code
# with that bundle, and packs the npm package @nimblescape/plantuml of cli/
# with npm pack. Both stay workflow artifacts for inspection. The job "Test on
# Windows" runs the tests and the tests in VS Code on Windows, for the paths of
# Windows. The job "package" runs the tests of the built npm package on Linux
# and macOS, with the oldest Node.js that the package supports (engines of
# cli/package.json) and the newest LTS release. This workflow publishes
# nothing: the release workflow calls it for the commit of a version and
# publishes the VSIX and the npm package of that call. A change of this file
# changes the release process: its pull request needs a dry run (rule 4).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

jobs:
  check:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Check the code with the linter
        run: npm run lint

      - name: Run the tests
        run: npm test

      - name: Build the VSIX package
        run: npm run package

      # VS Code needs a display; xvfb-run gives it a virtual one.
      - name: Run the tests in VS Code
        run: xvfb-run -a npm run test:vscode
        timeout-minutes: 10

      # The production build of the VSIX wrote cli/dist/, so the npm package holds the same renderer as the VSIX.
      - name: Build the npm package
        run: npm pack ./cli

      - name: Keep the VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Keep the npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: '*.tgz'
          if-no-files-found: error

  package:
    name: npm package on ${{ matrix.os }} with Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Install the locked npm package without install scripts
        run: npm ci --ignore-scripts --prefix cli

      # The tests load the built cli/dist/index.js with this Node.js and markdown-it of the development tools.
      - name: Run the tests of the npm package
        run: npm run test:cli

  windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Run the tests
        run: npm test

      - name: Build the extension
        run: npm run build

      - name: Run the tests in VS Code
        run: npm run test:vscode
        timeout-minutes: 10
